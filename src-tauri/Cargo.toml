[package]
name = "enigma-editor"
version = "0.1.0"
edition = "2021"
description = "Tauri backend for the Enigma Narrative supplement editor prototype"

[lib]
name = "enigma_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test seams for the Playwright suite (e2e/): see src/e2e.rs.
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shared = { path = "../shared" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
quick-xml = "0.37"
pathdiff = "0.2"
dunce = "1"
notify = "8"

[dev-dependencies]
tempfile = "3"
