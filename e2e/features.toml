# The editor's UI features, for the coverage check (coverage/test_coverage.py). Each lists
# the tests that use it, as "test_module.py::test_name", from the story or the secondary
# suite. The check fails when a feature has no test that passed in the run. Backend edits
# are checked separately, from the change log, against every *Edit variant in shared/src.
#
# Features in the pending table have no test yet: the check reports them but doesn't fail.

