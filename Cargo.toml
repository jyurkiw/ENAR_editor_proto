[package]
name = "enigma-ui"
version = "0.1.0"
edition = "2021"
description = "Leptos frontend for the Enigma Narrative supplement editor prototype"

[dependencies]
shared = { path = "shared" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["MouseEvent", "KeyboardEvent", "FocusEvent", "DragEvent", "DataTransfer", "Window", "Document", "Node", "Element", "HtmlElement", "DomRect", "EventTarget", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlDetailsElement", "HtmlDocument", "Selection", "Range", "NodeList", "Text"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1"

[workspace]
members = ["src-tauri", "shared"]
resolver = "2"
